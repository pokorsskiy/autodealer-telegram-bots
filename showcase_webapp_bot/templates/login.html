<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Auto — вход в админку</title>
  <link rel="stylesheet" href="/admin/admin.css?v=20260929-3">
</head>
<body class="login-page">
  <main class="login-card">
    <span class="logo">DA</span>
    <p class="eyebrow">Закрытая веб-админка</p>
    <h1>Управление каталогом</h1>
    <p class="muted">Войдите под учётной записью владельца или менеджера.</p>
    {% if setup_error %}<div class="alert alert--setup">{{ setup_error }}</div>{% endif %}
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label><span>Логин</span><input name="username" required maxlength="50" autocomplete="username" autofocus></label>
      <label><span>Пароль</span><input name="password" type="password" required maxlength="200" autocomplete="current-password"></label>
      <button type="submit">Войти <span>→</span></button>
    </form>
  </main>
</body>
</html>
